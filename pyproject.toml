[project]
name = "turkce-konu-analizi"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
"src/preprocessing/text.py" = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: gerçek internet erişimi gerektirir (NLP_NETWORK_TESTS=1 ile çalışır)",
  "model: eğitilmiş model dosyası gerektirir",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
